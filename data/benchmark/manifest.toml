# Each dataset is identified by the SHA-256 of its prepared text file; the
# statistics are computed from that file with `read_transactions`.
# `experiments/prepare_benchmarks.jl` downloads, verifies, and checks them.

[chess]
version = "FIMI 2003, byte-identical SPMF copy"
file = "chess.txt"
sha256 = "a12ea887df58a396709430af5bf0a9a32d1f6eba8e7c13dd41f28b98572c5db2"
transactions = 3196
items = 75
total_items = 118252
max_width = 37
min_item = 1
max_item = 75
origin = "UCI Chess (King-Rook vs. King-Pawn), binarized by R. Bayardo for FIMI"
terms = "UCI Machine Learning Repository dataset; cite the FIMI repository and UCI"

[[chess.sources]]
url = "https://www.philippe-fournier-viger.com/spmf/publicdatasets/chess.txt"
format = "text"

[[chess.sources]]
url = "https://cs.rpi.edu/~zaki/Workshops/FIMI/data/chess.dat.gz"
format = "gzip"

[mushroom]
