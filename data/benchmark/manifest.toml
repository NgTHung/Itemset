[retail]
version = "FIMI 2003, SPMF copy with every item ID increased by 1"
file = "retail.txt"
sha256 = "732c26de19888cb570d3fbb97e47206a9b1c0ce064f85dc1403314ba38f04eaa"
transactions = 88162
items = 16470
total_items = 908576
max_width = 76
min_item = 1
max_item = 16470
origin = "Anonymized receipts from a Belgian retail store, donated by T. Brijs to FIMI"
terms = "Any use is allowed with proper acknowledgement (Brijs et al., KDD 1999) and a copy of the work sent to the donor"
notes = "FIMI's retail.dat uses item 0, which SPMF rejects. The SPMF copy shifts every ID by 1, which keeps every support unchanged."

[[retail.sources]]
url = "https://www.philippe-fournier-viger.com/spmf/publicdatasets/retail.txt"
format = "text"

