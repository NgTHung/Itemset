# Coarse pilot that finds where each series becomes slow, so the final
# 5 to 7 thresholds per dataset span measurable runtimes. Pass --project to
# time another checkout and --java to choose the Java that runs SPMF.
name = "pilot"
variants = ["baseline", "spmf"]
repeats = 1
timeout_seconds = 300
keep_outputs = true
spmf_version = "2.66"

[[series]]
dataset = "chess"
minsup = [0.9, 0.85, 0.8, 0.75, 0.7, 0.65, 0.6, 0.55, 0.5]

[[series]]
dataset = "mushroom"
minsup = [0.5, 0.4, 0.3, 0.25, 0.2, 0.15, 0.1, 0.05]

[[series]]
dataset = "retail"
minsup = [0.01, 0.005, 0.0025, 0.001, 0.0005, 0.00025]

[[series]]
dataset = "T10I4D100K"
minsup = [0.01, 0.005, 0.0025, 0.001, 0.0005, 0.00025]
