# Stage profile of the optimized CLI path at a high and a low minsup of each benchmark.
# scripts/stage_profile.jl reads the series and the repeats below. The other keys complete the run configuration.
name = "stage-profile"
variants = ["optimized"]
mode = "cli"
stage = "profile"
hypothesis = "Intersections dominate the optimized miner on T10I4D100K only. Output dominates Chess and Mushroom, and the root layout dominates Accidents and Retail."
repeats = 5
timeout_seconds = 300
keep_outputs = false
verify_outputs = false
skip_after_timeout = false
spmf_version = "2.66"

[[series]]
dataset = "chess"
minsup = [0.9, 0.6]

[[series]]
dataset = "mushroom"
minsup = [0.5, 0.1, 0.05]

[[series]]
dataset = "retail"
minsup = [0.01, 0.001]

[[series]]
dataset = "T10I4D100K"
minsup = [0.01, 0.00025]

[[series]]
dataset = "accidents"
minsup = [0.95, 0.65]
