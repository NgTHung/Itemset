name = "report-peak-memory"
variants = ["baseline", "optimized"]
mode = "cli"
repeats = 5
timeout_seconds = 300
keep_outputs = false
verify_outputs = true
spmf_version = "2.66"
java_options = ["-Xms64m", "-Xmx3g", "-XX:+UseSerialGC"]

[[series]]
dataset = "chess"
minsup = [0.75]

[[series]]
dataset = "mushroom"
minsup = [0.25]

[[series]]
dataset = "retail"
minsup = [0.0025]

[[series]]
dataset = "T10I4D100K"
minsup = [0.001]

[[series]]
dataset = "accidents"
minsup = [0.8]
