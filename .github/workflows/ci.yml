name: Julia setup and tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        julia: ['1.12.6', '1.13.2']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - name: Instantiate environment
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Verify setup
        run: julia --startup-file=no --project=. scripts/check_setup.jl
      - name: Run tests
        run: julia --startup-file=no --project=. test/runtests.jl
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Test reporting scripts
        run: uv run --no-project --python 3.12 --with matplotlib==3.10.7 python -m unittest discover -s tests -p 'test_*.py'
